<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - RedeVita</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
{% from "_brand_logo.html" import brand_logo %}
<body style="background-color: #0b0f17;">
{% include "_accessibility_controls.html" %}
<div class="auth-wrapper">
    <div class="auth-card" style="background-color: #151c2a;">
        <div class="auth-header">
            {{ brand_logo(url_for('auth.login')) }}
            <h2>Criar Conta</h2>
            <p>Preencha os dados para se registrar no sistema.</p>
        </div>

        <form action="{{ url_for('auth.cadastro') }}" method="POST" class="modern-form" id="form-cadastro">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="nome">Nome Completo <span class="required">*</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" name="nome" id="nome" placeholder="Seu nome completo"
                           required maxlength="100" autocomplete="name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00"
                               required maxlength="14" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cargo">Cargo</label>
                    <div class="input-with-icon">
                        <i class="fas fa-briefcase"></i>
                        <select name="cargo" id="cargo">
                            <option value="Voluntário">Voluntário</option>
                            <option value="Farmacêutico">Farmacêutico</option>
                            <option value="Médico">Médico</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail <span class="text-muted">(opcional, necessário para recuperar senha)</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="seu@email.com"
                           autocomplete="email">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha">Senha <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="senha" id="senha" placeholder="Mínimo 6 caracteres"
                               required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmar_senha">Confirmar Senha <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="confirmar_senha" id="confirmar_senha"
                               placeholder="Repita a senha" required autocomplete="new-password">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary-gradient">
                <i class="fas fa-user-plus"></i> Criar Conta
            </button>
        </form>

        <div class="auth-footer">
            <p>Já tem uma conta? <a href="{{ url_for('auth.login') }}">Faça o login</a></p>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/mascaras.js') }}"></script>
<script>
document.getElementById('form-cadastro').addEventListener('submit', function(e) {
    const senha = document.getElementById('senha').value;
    const confirmar = document.getElementById('confirmar_senha').value;
    if (senha !== confirmar) {
        e.preventDefault();
        alert('As senhas não coincidem!');
    }
});
</script>
</body>
</html>

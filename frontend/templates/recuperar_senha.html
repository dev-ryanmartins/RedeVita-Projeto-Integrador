{% extends "base.html" %}
{% block title %}Recuperar Senha - RedeVita{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('auth.login') }}" class="logo-auth">
                <i class="fas fa-heartbeat"></i> <strong>Rede</strong>Vita
            </a>
            <h2>Recuperar Senha</h2>
            <p>Informe seu e-mail cadastrado e enviaremos um link de recuperação.</p>
        </div>

        <form action="{{ url_for('auth.recuperar_senha') }}" method="POST" class="modern-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">E-mail de Cadastro <span class="required">*</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email"
                           placeholder="seu@email.com" required autocomplete="email">
                </div>
            </div>
            <button type="submit" class="btn-primary-gradient">
                <i class="fas fa-paper-plane"></i> Enviar Link
            </button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Voltar para o Login</a>
        </div>
    </div>
</div>
{% endblock %}

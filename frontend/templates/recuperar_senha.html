<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - RedeVita</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
{% from "_brand_logo.html" import brand_logo %}
<body style="background-color: #0b0f17;">
{% include "_accessibility_controls.html" %}
<div class="auth-wrapper">
    <div class="auth-card" style="background-color: #151c2a;">
        <div class="auth-header">
            {{ brand_logo(url_for('auth.login')) }}
            <h2>Recuperar Senha</h2>
            <p>Informe seu e-mail cadastrado e enviaremos um link de recuperação.</p>
        </div>

        <form action="{{ url_for('auth.recuperar_senha') }}" method="POST" class="modern-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">E-mail de Cadastro <span class="required">*</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email"
                           placeholder="seu@email.com" required autocomplete="email">
                </div>
            </div>
            <button type="submit" class="btn-primary-gradient">
                <i class="fas fa-paper-plane"></i> Enviar Link
            </button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Voltar para o Login</a>
        </div>
    </div>
</div>
</body>
</html>

<div class="accessibility-controls" aria-label="Preferências de visualização">
    <button type="button" class="accessibility-control" data-theme-toggle
            aria-label="Alternar tema" title="Alternar tema" data-tooltip="Alternar tema">
        <i class="fas fa-sun" data-theme-icon aria-hidden="true"></i>
        <span class="sr-only">Alternar tema claro ou escuro</span>
    </button>
    <button type="button" class="accessibility-control" data-font-decrease
            aria-label="Diminuir tamanho da fonte" title="Diminuir fonte" data-tooltip="Diminuir fonte">
        <span aria-hidden="true">A−</span>
        <span class="sr-only">Diminuir tamanho da fonte</span>
    </button>
    <button type="button" class="accessibility-control" data-font-increase
            aria-label="Aumentar tamanho da fonte" title="Aumentar fonte" data-tooltip="Aumentar fonte">
        <span aria-hidden="true">A+</span>
        <span class="sr-only">Aumentar tamanho da fonte</span>
    </button>
</div>

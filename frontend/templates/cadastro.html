{% extends "base.html" %}
{% block title %}Cadastro - RedeVita{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('auth.login') }}" class="logo-auth">
                <i class="fas fa-heartbeat"></i> <strong>Rede</strong>Vita
            </a>
            <h2>Criar Conta</h2>
            <p>Preencha os dados para se registrar no sistema.</p>
        </div>

        <form action="{{ url_for('auth.cadastro') }}" method="POST" class="modern-form" id="form-cadastro">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="nome">Nome Completo <span class="required">*</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" name="nome" id="nome" placeholder="Seu nome completo"
                           required maxlength="100" autocomplete="name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00"
                               required maxlength="14" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cargo">Cargo</label>
                    <div class="input-with-icon">
                        <i class="fas fa-briefcase"></i>
                        <select name="cargo" id="cargo">
                            <option value="Voluntário">Voluntário</option>
                            <option value="Farmacêutico">Farmacêutico</option>
                            <option value="Médico">Médico</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail <span class="text-muted">(opcional, necessário para recuperar senha)</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="seu@email.com"
                           autocomplete="email">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha">Senha <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="senha" id="senha" placeholder="Mínimo 6 caracteres"
                               required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmar_senha">Confirmar Senha <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="confirmar_senha" id="confirmar_senha"
                               placeholder="Repita a senha" required autocomplete="new-password">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary-gradient">
                <i class="fas fa-user-plus"></i> Criar Conta
            </button>
        </form>

        <div class="auth-footer">
            <p>Já tem uma conta? <a href="{{ url_for('auth.login') }}">Faça o login</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('form-cadastro').addEventListener('submit', function(e) {
    const senha = document.getElementById('senha').value;
    const confirmar = document.getElementById('confirmar_senha').value;
    if (senha !== confirmar) {
        e.preventDefault();
        alert('As senhas não coincidem!');
    }
});
</script>
{% endblock %}

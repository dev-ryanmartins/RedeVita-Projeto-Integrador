name: CI RedeVita

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install pytest pytest-cov flake8
    
    - name: Lint com flake8
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Testes unitários
      run: |
        cd backend
        if [ -d "../tests" ]; then
          export PYTHONPATH="../backend:$PYTHONPATH"
          pytest ../tests/ --cov=backend --cov-report=xml --cov-report=html --tb=short
        else
          echo "Pasta tests/ não encontrada. Pulando testes."
        fi
    
    - name: Upload coverage reports
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  test-mysql-concurrency:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password_123
          MYSQL_DATABASE: test_redevita
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root_password_123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install pytest pymysql
    
    - name: Aguardar MySQL estar pronto
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h 127.0.0.1 -u root -ptest_root_password_123 --silent; then
            echo "MySQL está pronto"
            break
          fi
          echo "Aguardando MySQL... ($i/30)"
          sleep 2
        done
    
    - name: Preparar schema de teste MySQL
      run: |
        mysql -h 127.0.0.1 -u root -ptest_root_password_123 test_redevita < tests/mysql_test_schema.sql
    
    - name: Testes de concorrência MySQL (P0.9)
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: test_user
        MYSQL_PASSWORD: test_password_123
        MYSQL_DATABASE: test_redevita
      run: |
        cd backend
        export PYTHONPATH="../backend:$PYTHONPATH"
        pytest ../tests/test_mysql_concurrency.py -v --tb=short

